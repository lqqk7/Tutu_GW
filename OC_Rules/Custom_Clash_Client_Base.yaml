mixed-port: 7893
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:
  - name: 🚀 手动选择
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: '(?i)^US-RELAY-.+$'
    empty-fallback: REJECT
  - name: Polymarket 国际站
    type: select
    include-all-proxies: true
    include-all-providers: true
    filter: '(?i)^HK-.+$'
    empty-fallback: REJECT

rule-providers:
  Tutu_IPv6_Block:
    type: inline
    behavior: classical
    payload:
      - IP-CIDR6,::/0,no-resolve
  Tutu_QUIC_Block:
    type: inline
    behavior: classical
    payload:
      - AND,((NETWORK,UDP),(DST-PORT,443))

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-mode: hijack
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - any:53
    - tcp://any:53

sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  skip-domain:
    - "+.apple.com"
    - "+.flashforge.com"
    - "+.fdmcloud.flashforge.com"
    - "+.voxelshare.com"
    - "+.netease.im"
    - "+.chatnos.com"
  parse-pure-ip: true
  force-dns-mapping: true

dns:
  enable: true
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: false
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.flashforge.com"
    - "+.fdmcloud.flashforge.com"
    - "+.voxelshare.com"
    - "+.netease.im"
    - "+.chatnos.com"
    - "geosite:cn"
  fake-ip-filter-mode: blacklist
  respect-rules: true
  default-nameserver:
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
  proxy-server-nameserver:
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
  nameserver:
    - https://cloudflare-dns.com/dns-query#🚀 手动选择
    - https://dns.google/dns-query#🚀 手动选择
    - https://dns.quad9.net/dns-query#🚀 手动选择
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
